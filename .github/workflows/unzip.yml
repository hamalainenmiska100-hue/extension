name: Unzip extension_latest.zip and commit

on:
  workflow_dispatch:
  push:
    paths:
      - extension_latest.zip

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify zip exists
        run: |
          if [ ! -f extension_latest.zip ]; then
            echo "extension_latest.zip not found in repository root"
            exit 1
          fi

      - name: Unzip into repository root
        run: |
          unzip -o extension_latest.zip -d .

      - name: Remove zip file from repo
        run: |
          rm -f extension_latest.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Extract extension_latest.zip"
          git push
